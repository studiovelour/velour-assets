<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velour Studio - портфолио</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:#FAFAF9;color:#1C1917;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:72px 24px}
h1{font-family:Cormorant,serif;font-weight:600;font-size:clamp(44px,6vw,72px);line-height:1.05;margin:0 0 16px}
.lead{color:#57534E;font-size:18px;margin:0 0 56px;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #E7E5E4;border-radius:20px;overflow:hidden;transition:border-color 200ms}
.card:hover{border-color:#A16207}
.card:focus-visible{outline:3px solid #A16207;outline-offset:3px}
.thumb{aspect-ratio:16/10;background:#1C1917;color:#D4A24C;display:flex;align-items:center;justify-content:center;font-family:Cormorant,serif;font-size:34px;font-weight:600}
.meta{padding:22px 24px}
.meta h2{margin:0 0 4px;font-size:18px}
.meta p{margin:0;color:#57534E;font-size:14px}
footer{color:#57534E;font-size:14px;margin-top:72px}
a{color:#A16207}
</style>
</head>
<body>
<div class="wrap">
<h1>Velour Studio</h1>
<p class="lead">Сайты для медиков и бьюти-специалистов. Websites for medical &amp; beauty specialists.</p>
<div class="grid">
<a class="card" href="works/aurum-hair-clinic/">
<div class="thumb">Aurum Hair Clinic</div>
<div class="meta"><h2>Клиника пересадки волос</h2><p>Демо-концепция · лендинг · до/после, цены, запись</p></div>
</a>
</div>
<footer>EN / RU · <a href="https://instagram.com/wearevelour">@wearevelour</a> · <a href="mailto:wearestudiovelour@gmail.com">wearestudiovelour@gmail.com</a></footer>
</div>
</body>
</html>
